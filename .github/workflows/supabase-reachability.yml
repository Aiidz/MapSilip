name: Supabase reachability

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check read-only database RPC
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]] || [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo 'Supabase URL or publishable key is not configured.' >&2
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 15 --retry 2 --retry-delay 5 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/rpc/mapsilip_project_ping")
          if [[ "$status" != '200' ]]; then
            echo "Supabase read-only check failed (HTTP $status)." >&2
            exit 1
          fi
          echo 'Supabase read-only check succeeded (HTTP 200).'
